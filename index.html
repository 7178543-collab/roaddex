function normSearch(v){ return String(v??'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' '); }
function compactSearch(v){ return normSearch(v).replace(/\s+/g,''); }
function trigramScore(a,b){
  a=normSearch(a); b=normSearch(b); if(!a||!b)return 0;
  const grams=x=>{const z='  '+x+'  ',m=new Map();for(let i=0;i<z.length-2;i++){const g=z.slice(i,i+3);m.set(g,(m.get(g)||0)+1);}return m;};
  const A=grams(a),B=grams(b);let hit=0,total=0;for(const n of A.values())total+=n;for(const n of B.values())total+=n;
  for(const [g,n] of A)hit+=Math.min(n,B.get(g)||0);
  return total?2*hit/total:0;
}
function searchText(c){ return [c.make,c.model,c.gen,c.years,c.rarity,...c.variants,...(aliases[c.id]||[])].join(' '); }
function searchCars(q,list=cars){
  const n=normSearch(q), compact=compactSearch(q); if(!n)return list;
  const tokens=n.split(' ').filter(Boolean);
  return list.map(c=>{
    const fields=[c.make,c.model,c.gen,c.years,c.rarity,...c.variants,...(aliases[c.id]||[])].filter(Boolean);
    const normalized=fields.map(normSearch), compacts=fields.map(compactSearch);
    let score=0;
    if(normalized.some(x=>x===n)||compacts.some(x=>x===compact))score=1;
    else if(normalized.some(x=>x.includes(n))||compacts.some(x=>x.includes(compact)))score=.95;
    else if(tokens.every(t=>normalized.some(x=>x.includes(t))))score=.8;
    else score=Math.max(...normalized.map(x=>trigramScore(n,x)),0);
    return {c,score};
  }).filter(x=>x.score>=.28).sort((a,b)=>b.score-a.score||a.c.make.localeCompare(b.c.make)||a.c.model.localeCompare(b.c.model)).map(x=>x.c);
}

  if(typeof p === 'string') return {data:p,focusX:50,focusY:50,zoom:1,source:fallbackSource||'LIBRARY'};
  const zoom=Number.isFinite(Number(p.zoom))?Math.max(1,Math.min(4,Number(p.zoom))):1;
  return {data:p.data||'',focusX:Number.isFinite(p.focusX)?p.focusX:50,focusY:Number.isFinite(p.focusY)?p.focusY:50,zoom,source:p.source||fallbackSource||'LIBRARY'};
}
function normalizeState(raw){

    const photos = Array.isArray(s.photos) ? s.photos.map(p=>normalizePhoto(p,s.source)).filter(Boolean) : (s.photo ? [normalizePhoto(s.photo,s.source)] : []);
    return {...s, id:s.id||Date.now()+Math.random(), car:s.car||null, partial:s.partial||null, unknown:!!s.unknown || (!s.car&&!s.partial), identityStatus:s.car?'IDENTIFIED':(s.partial?'PARTIAL':'UNKNOWN'), variant:s.variant||'', tags:Array.isArray(s.tags)?s.tags:[], context:s.context||'WILD', source:s.source||photos[0]?.source||'CAMERA', photos, coverIndex:Math.min(Math.max(Number(s.coverIndex)||0,0),Math.max(photos.length-1,0)), at:s.at||new Date().toISOString()};

}

function processImageFile(f,max=760,quality=0.56){
  return new Promise(resolve=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>h&&w>max){h=Math.round(h*max/w);w=max}else if(h>=w&&h>max){w=Math.round(w*max/h);h=max}
        const canvas=document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=()=>resolve(r.result); img.src=r.result;
    };
    r.readAsDataURL(f);
  });
}
async function loadPhotos(e,source){

  if(capture.coverIndex>=capture.photos.length)capture.coverIndex=0; render();
}

async function loadCatalogMaps(){
  const [catalogue,mapRows]=await Promise.all([
    sb.rpc('get_vehicle_catalogue'),
    sb.from('vehicle_generations').select('id,catalog_key,vehicle_variants(id,name)').not('catalog_key','is',null)
  ]);
  if(catalogue.error)throw catalogue.error;if(mapRows.error)throw mapRows.error;
  catalogMap={};variantMap={};
  for(const g of mapRows.data||[]){if(g.catalog_key)catalogMap[g.catalog_key]=g.id;for(const v of g.vehicle_variants||[])variantMap[(g.catalog_key||'')+'|'+v.name]=v.id;}
  const next=[];
  for(const g of catalogue.data||[]){
    if(!g.catalog_key)continue;
    next.push({id:g.catalog_key,make:g.make,model:g.model,gen:g.generation,years:g.display_years||'',rarity:g.rarity_seed||'Unrated',variants:Array.isArray(g.variants)?g.variants:[]});
    if(Array.isArray(g.aliases)){
      if(!aliases[g.catalog_key])aliases[g.catalog_key]=[];
      for(const a of g.aliases)if(a&&!aliases[g.catalog_key].includes(a))aliases[g.catalog_key].push(a);
    }
  }
  if(next.length)cars=next.sort((a,b)=>a.make.localeCompare(b.make)||a.model.localeCompare(b.model)||a.gen.localeCompare(b.gen));
}

function generationIdFor(s){return s.car?catalogMap[s.car]||null:null;}

async function cloudUploadPhoto(s,p,index){
  if(!p?.data)return p;
  const blob=await fetch(p.data).then(r=>r.blob());
  const ext=blob.type==='image/png'?'png':blob.type==='image/webp'?'webp':'jpg';
  const path=session.user.id+'/'+s.id+'/'+String(index+1).padStart(2,'0')+'-'+crypto.randomUUID()+'.'+ext;
  const {error:ue}=await sb.storage.from('sightings').upload(path,blob,{contentType:blob.type||'image/jpeg',upsert:false});if(ue)throw ue;
  const payload={sighting_id:s.id,storage_path:path,cover:index===(s.coverIndex||0),focus_x:(Number(p.focusX)||50)/100,focus_y:(Number(p.focusY)||50)/100,zoom:Number(p.zoom)||1,source:p.source||s.source||'LIBRARY'};
  const {data:pr,error:pe}=await sb.from('sighting_photos').insert(payload).select('id').single();if(pe)throw pe;
  p.storagePath=path;p.cloudPhotoId=pr.id;return p;
}
async function cloudSaveSighting(s){
  if(!session)throw new Error('Not signed in.');if(!/^[0-9a-f-]{36}$/i.test(String(s.id)))s.id=crypto.randomUUID();
  const payload={id:s.id,user_id:session.user.id,generation_id:generationIdFor(s),variant_id:variantIdFor(s),partial_make:s.partial?.make||null,partial_model:s.partial?.model||null,identity_status:s.car?'IDENTIFIED':(s.partial?'PARTIAL':'UNKNOWN'),context:s.context,source:s.source,region_code:'CA-ON',captured_at:s.at||new Date().toISOString()};
  const {error}=await sb.from('sightings').insert(payload);if(error)throw error;
  for(let i=0;i<getPhotos(s).length;i++)await cloudUploadPhoto(s,s.photos[i],i);
  if(s.tags?.length){const {error:te}=await sb.from('sighting_tags').insert(s.tags.map(tag=>({sighting_id:s.id,tag})));if(te)throw te;}
  s.user_id=session.user.id;return s;
}
async function cloudUpdateSighting(s){
  const payload={generation_id:generationIdFor(s),variant_id:variantIdFor(s),partial_make:s.partial?.make||null,partial_model:s.partial?.model||null,identity_status:s.car?'IDENTIFIED':(s.partial?'PARTIAL':'UNKNOWN'),context:s.context,source:s.source,updated_at:new Date().toISOString()};
  const {error}=await sb.from('sightings').update(payload).eq('id',s.id);if(error)throw error;
}
async function cloudUpdatePhotoFrame(p){const {error}=await sb.from('sighting_photos').update({focus_x:(Number(p.focusX)||50)/100,focus_y:(Number(p.focusY)||50)/100,zoom:Number(p.zoom)||1}).eq('id',p.cloudPhotoId);if(error)throw error;}
async function cloudSetCover(s,index){
  const ps=getPhotos(s).filter(p=>p.cloudPhotoId);if(!ps.length)return;let r=await sb.from('sighting_photos').update({cover:false}).eq('sighting_id',s.id);if(r.error)throw r.error;const p=s.photos[index];if(p?.cloudPhotoId){r=await sb.from('sighting_photos').update({cover:true}).eq('id',p.cloudPhotoId);if(r.error)throw r.error;}
}
async function cloudDeletePhoto(p){if(!p)return;if(p.storagePath){const {error}=await sb.storage.from('sightings').remove([p.storagePath]);if(error)throw error;}if(p.cloudPhotoId){const {error}=await sb.from('sighting_photos').delete().eq('id',p.cloudPhotoId);if(error)throw error;}}
async function refreshCloud(){if(cloudBusy)return;setBusy(true,'Refreshing shared data…');try{await loadCloud();}catch(err){cloudError(err);}finally{setBusy(false);render();}}
async function migrateLegacyData(){
  if(!legacySightings.length||cloudBusy)return;if(!confirm('Upload '+legacySightings.length+' sightings from this device into your shared tester account?'))return;
  setBusy(true,'Migrating V9 sightings…');try{let n=0;for(const old of legacySightings){const s=deepClone(old);s.id=crypto.randomUUID();await cloudSaveSighting(s);n++;cloudBusyText='Migrating V9 sightings… '+n+'/'+legacySightings.length;render();}localStorage.setItem(LEGACY_MIGRATION_KEY+'-'+session.user.id,'1');await loadCloud();alert('V9 device data is now in the shared database.');}catch(err){cloudError(err);}finally{setBusy(false);render();}
}
async function boot(){
  app.innerHTML='<div class="authbox"><div class="logo">ROADDEX</div><div class="muted">Connecting to shared test database…</div></div>';
  const {data,error}=await sb.auth.getSession();if(error){cloudError(error);session=null;render();return;}session=data.session;
  if(session){try{await loadCloud();screen='home';}catch(err){cloudError(err);}}
  else screen='auth';render();
}
sb.auth.onAuthStateChange((event,newSession)=>{if(event==='SIGNED_OUT'){session=null;profile=null;screen='auth';render();}});
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}), url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download='roaddex-backup-update-'+UPDATE+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importData(e){
  const f=e.target.files&&e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const incoming=normalizeState(JSON.parse(r.result)); if(!confirm('Replace this prototype\'s local data with the selected backup?'))return; state=incoming; save(); nav('home'); }catch{ alert('That file is not a valid RoadDex backup.'); } }; r.readAsText(f);
}
function render(){ if(!session){app.innerHTML=authScreen()+busyOverlay();return;} const views={home,capture:captureScreen,batchunknown:batchUnknownScreen,photoedit:photoEditScreen,identify,discovery,dex,idboard,communitySighting,journal,sighting,editSighting:editSightingScreen,vehicle,profile:profileScreen,leaderboards:leaderboardScreen}; app.innerHTML=(views[screen]||home)()+busyOverlay(); }
boot();
</script></body></html>
